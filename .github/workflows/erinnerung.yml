name: Erinnerung Tagesprotokoll

# Alle 30 Minuten am Abend (Ortszeit etwa 16–24 Uhr) fragt dieser Lauf die Edge Function „push-senden“, ob für einen Treff
# das Tagesprotokoll fehlt. Wer erinnert wird, entscheidet die Datenbank (Migrationen 0016, 0026): das Team des Treffs,
# einmal pro Treff und Tag, frühestens 15 Minuten nach Ende der Öffnungszeit, nicht an Feiertagen und in Schließzeiten.
# Seit Migration 0029 kommt im selben Lauf auch „Checkliste: heute fällig“ an die Leitungen einer Freizeit (einmal am Tag).
# Nötige GitHub-Secrets: SUPABASE_URL, SUPABASE_ANON_KEY, CRON_SECRET (dasselbe Zufallsgeheimnis wie bei der Edge Function, siehe docs/BETRIEB.md).

on:
  schedule:
    - cron: '7,37 14-21 * * *'     # UTC; deckt Sommer- und Winterzeit ab
  workflow_dispatch:

jobs:
  erinnern:
    runs-on: ubuntu-latest
    steps:
      - name: Erinnerungen auslösen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Die Secrets SUPABASE_URL, SUPABASE_ANON_KEY und CRON_SECRET fehlen – keine Erinnerungen (Repository → Settings → Secrets and variables → Actions)."
            exit 0
          fi
          code=$(curl --silent --show-error --max-time 60 --retry 2 --retry-delay 10 --output antwort.json --write-out '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/functions/v1/push-senden" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}')
          echo "Antwort ($code): $(cat antwort.json)"
          if [ "$code" = "503" ]; then
            echo "::warning::Mitteilungen sind noch nicht eingerichtet (VAPID-Schlüssel in der Edge Function fehlen)."
            exit 0
          fi
          test "$code" -ge 200 && test "$code" -lt 300
